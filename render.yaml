services:
  - type: web
    name: backend-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: projet_stages_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nom-de-ton-frontend.vercel.app,http://localhost:5173
      - key: DB_NAME
        value: projet_stages
      - key: DB_USER
        value: projet_user
      - key: DB_PASSWORD
        generateValue: true

databases:
  - name: projet_stages_db
    plan: free
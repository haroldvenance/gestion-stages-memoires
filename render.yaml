services:
  - type: web
    name: backend-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application
    releaseCommand: |
      python manage.py migrate
      python manage.py shell -c "
      import os
      from django.contrib.auth import get_user_model
      User = get_user_model()
      username = os.environ.get('DJANGO_SUPERUSER_USERNAME')
      email = os.environ.get('DJANGO_SUPERUSER_EMAIL')
      password = os.environ.get('DJANGO_SUPERUSER_PASSWORD')
      if username and password and not User.objects.filter(username=username).exists():
          User.objects.create_superuser(username, email, password)
          print(f'Superuser {username} created successfully')
      else:
          print('Superuser already exists or missing credentials')
      "
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-stages-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "backend-api-0yjk.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gestion-stages-memoires.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gestion-stages-memoires.vercel.app,https://backend-api-0yjk.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Variables pour le superuser (à saisir dans Render)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: gestion-stages-db
    plan: free
    region: oregon
    databaseName: gestion_stages
    user: gestion_user
services:
  - type: web
    name: backend-api
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application
    releaseCommand: |
      python manage.py migrate
      python manage.py collectstatic --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-stages-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "backend-api-0yjk.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gestion-stages-memoires.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gestion-stages-memoires.vercel.app,https://backend-api-0yjk.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: gestion-stages-db
    plan: free
    region: oregon
    databaseName: gestion_stages
    user: gestion_user